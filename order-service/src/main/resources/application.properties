spring.application.name=order-service

# Logging
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=INFO

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5433/fooddelivery_order?currentSchema=public
spring.datasource.username=fooddelivery
spring.datasource.password=fooddelivery
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.change-log=classpath:db/master.xml
spring.liquibase.enabled=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

#Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=orderCreatedEvent:com.fooddelivery.common.event.OrderCreatedEvent

#Consumer
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=paymentCompletedEvent:com.fooddelivery.common.event.PaymentCompletedEvent

spring.kafka.producer.properties.spring.json.add.type.headers=true
